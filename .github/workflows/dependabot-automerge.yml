name: Dependabot auto-merge

# After Validate passes on a Dependabot pull request, merge it when every update in it keeps its major version.
# Major updates, failing checks and anything not from Dependabot wait for a person.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- no checkout; reads the PR via the API and merges only the tested Dependabot commit
    workflows: ["Validate"]
    types: [completed]

permissions:
  contents: read

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No checkout: this only reads the pull request through the API, so no pull request code runs here.
      - name: Merge patch and minor updates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ -n "$PR" ]] || { echo "No pull request on this run."; exit 0; }
          author=$(gh pr view "$PR" --repo "$REPO" --json author -q .author.login)
          [[ "$author" == "app/dependabot" || "$author" == "dependabot[bot]" ]] || { echo "Not from Dependabot ($author)."; exit 0; }
          text=$(gh pr view "$PR" --repo "$REPO" --json title,body -q '.title + "\n" + .body')
          # Every "from A to B" in the title and body; merge only if none changes the major version.
          pairs=$(grep -oE 'from `?v?[0-9][^ `]*`? to `?v?[0-9][^ `]*' <<<"$text" | sed -E 's/[`v]//g; s/^from //; s/ to / /' | sort -u)
          [[ -n "$pairs" ]] || { echo "Couldn't read the versions; leaving it for a person."; exit 0; }
          while read -r old new; do
            if [[ "${old%%.*}" != "${new%%.*}" ]]; then echo "Major update $old -> $new; leaving it for a person."; exit 0; fi
          done <<<"$pairs"
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$TESTED_SHA"
