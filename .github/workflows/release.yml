name: Release

# Pushing a version tag (git tag v1.2.0 && git push origin v1.2.0) publishes a GitHub release
# with notes generated from the merged pull requests and the prompt files attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check prompt files
        run: python3 scripts/check.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" \
            system_prompt.txt meta_prompt.txt a_little_more_human.json Sepia.json
