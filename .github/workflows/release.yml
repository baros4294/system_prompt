name: Release

# Pushing a version tag (git tag v1.2.0 && git push origin v1.2.0) publishes a GitHub release
# with notes generated from the merged pull requests and the prompt files attached.
# It can also be run by hand from the Actions tab with a version; that creates the tag on the current main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.2.0 (creates the tag)"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check prompt files
        run: python3 scripts/check.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like v1.2.0"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Run this from main"; exit 1; }
            target=(--target "$GITHUB_SHA")
          else
            target=(--verify-tag)
          fi
          gh release create "$TAG" "${target[@]}" --generate-notes --title "$TAG" \
            system_prompt.txt meta_prompt.txt a_little_more_human.json Sepia.json
